services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mitelovers:${APP_VERSION:-latest}
    ports:
      - "8081:8081"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
