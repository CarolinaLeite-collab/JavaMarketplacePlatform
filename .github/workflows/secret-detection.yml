name: secret-detection.yml

on:
  pull_request:
    branches:
      - main
      - b3
      - b4

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_REPORT_FORMAT: json
          GITLEAKS_REPORT_PATH: gitleaks-report.json
          GITLEAKS_REDACT: true

      - name: Upload Gitleaks JSON report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72af3ccb7c7e4a8ca3977058e8  # v4.6.0
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn