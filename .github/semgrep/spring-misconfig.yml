rules:
  - id: h2-console-enabled
    languages: [generic]
    severity: ERROR
    message: "H2 console enabled — allows arbitrary SQL execution via the browser."
    metadata: { owasp: "A05:2021 - Security Misconfiguration" }
    paths:
      include: ["**/*.properties", "**/*.yml", "**/*.yaml"]
      exclude: ["**/application-dev.properties"]
    pattern-regex: '(?m)^\s*spring\.h2\.console\.enabled\s*=\s*true'

  - id: actuator-all-endpoints-exposed
    languages: [generic]
    severity: ERROR
    message: "All Actuator endpoints exposed (include=*)."
    metadata: { owasp: "A05:2021 - Security Misconfiguration" }
    paths:
      include: ["**/*.properties", "**/*.yml", "**/*.yaml"]
      exclude: ["**/application-dev.properties"]
    pattern-regex: '(?m)^\s*management\.endpoints\.web\.exposure\.include\s*=\s*\*'

  - id: error-stacktrace-exposed
    languages: [generic]
    severity: ERROR
    message: "Stack traces exposed to the client (include-stacktrace=always)."
    paths:
      include: ["**/*.properties", "**/*.yml", "**/*.yaml"]
      exclude: ["**/application-dev.properties"]
    pattern-regex: '(?m)^\s*server\.error\.include-stacktrace\s*=\s*always'

  - id: actuator-health-details-always
    languages: [generic]
    severity: WARNING
    message: "Health details always visible — internal information disclosure."
    paths:
      include: ["**/*.properties", "**/*.yml", "**/*.yaml"]
      exclude: ["**/application-dev.properties"]
    pattern-regex: '(?m)^\s*management\.endpoint\.health\.show-details\s*=\s*always'

  - id: ssl-disabled
    languages: [generic]
    severity: WARNING
    message: "TLS disabled (server.ssl.enabled=false)."
    paths:
      include: ["**/*.properties", "**/*.yml", "**/*.yaml"]
      exclude: ["**/application-dev.properties"]
    pattern-regex: '(?m)^\s*server\.ssl\.enabled\s*=\s*false'

  - id: debug-enabled
    languages: [generic]
    severity: WARNING
    message: "Debug mode enabled in configuration."
    paths:
      include: ["**/*.properties", "**/*.yml", "**/*.yaml"]
      exclude: ["**/application-dev.properties"]
    pattern-regex: '(?m)^\s*debug\s*=\s*true'

  - id: jpa-show-sql
    languages: [generic]
    severity: INFO
    message: "show-sql enabled — SQL printed to logs."
    paths:
      include: ["**/*.properties", "**/*.yml", "**/*.yaml"]
      exclude: ["**/application-dev.properties"]
    pattern-regex: '(?m)^\s*spring\.jpa\.show-sql\s*=\s*true'